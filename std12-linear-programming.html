<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linear Programming — DKGraphSuite</title>
  <link rel="stylesheet" href="./src/styles/tokens.css" />
</head>
<body class="bg-dk-bg text-dk-text min-h-screen flex flex-col">
  <div id="header-container"></div>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col gap-6">
    <div class="flex flex-wrap justify-between items-center gap-4">
      <div>
        <span class="text-xs font-bold uppercase tracking-wider text-dk-primary bg-dk-primary/10 px-2.5 py-1 rounded border border-dk-primary/20">Std 12 Priority · Chapter 12</span>
        <h1 class="text-2xl md:text-3xl font-extrabold text-dk-text mt-1">Linear Programming Feasible Region Studio</h1>
      </div>
    </div>

    <!-- Main Workspace (2 Columns) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      <!-- Left: Feasible Region Canvas + Sliders (7 Cols) -->
      <div class="lg:col-span-7 flex flex-col gap-4">
        <div class="bg-dk-surface border border-dk-border rounded-dk-lg p-4 shadow-dk-sm flex flex-col gap-3">
          <div class="flex justify-between items-center text-xs font-semibold text-dk-muted">
            <span>Feasible Region Polygon (Teal Shaded) & Corner Points</span>
          </div>
          <div id="viewport-container" class="w-full h-[400px] relative"></div>

          <!-- Parameter Sliders -->
          <div id="slider-c1"></div>
          <div id="slider-c2"></div>
        </div>
      </div>

      <!-- Right: Optimization Summary & Practice (5 Cols) -->
      <div class="lg:col-span-5 flex flex-col gap-5">
        <!-- Corner Point Method Card -->
        <div class="bg-dk-surface border border-dk-border rounded-dk-lg p-5 shadow-dk-sm flex flex-col gap-3">
          <h3 class="text-md font-bold text-dk-text border-b border-dk-border pb-2">Optimization Result</h3>
          <div class="grid grid-cols-2 gap-3 text-sm">
            <div class="bg-dk-bg p-3 rounded-dk border border-dk-border">
              <span class="text-xs text-dk-muted block">Maximum Z</span>
              <strong id="val-maxz" class="text-xl text-dk-primary font-mono">11.00</strong>
            </div>
            <div class="bg-dk-bg p-3 rounded-dk border border-dk-border">
              <span class="text-xs text-dk-muted block">Optimal Corner</span>
              <strong id="val-corner" class="text-lg text-dk-text font-mono">(3, 1)</strong>
            </div>
          </div>
          <div class="bg-dk-surface-hover p-3 rounded-dk border border-dk-border text-xs text-dk-muted">
            <strong>Objective Function:</strong> Z = <span id="val-c1-text">3</span>x + <span id="val-c2-text">2</span>y <br />
            <strong>Corner Evaluations:</strong> (0,0) → 0 | (3,0) → 9 | <strong>(3,1) → 11</strong> | (0,4) → 8
          </div>
        </div>

        <!-- 10-Section Practice Question View -->
        <div id="practice-container"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { createDKHeader } from './src/components/ui/DKHeader.ts';
    import { GraphViewport } from './src/components/math/GraphViewport.ts';
    import { createDKSlider } from './src/components/ui/DKSlider.ts';
    import { MathEngine } from './src/core/MathEngine.ts';
    import { createPracticePanel } from './src/components/math/PracticePanel.ts';

    document.getElementById('header-container').appendChild(createDKHeader());

    const viewportContainer = document.getElementById('viewport-container');
    const viewport = new GraphViewport(viewportContainer);
    viewport.setBounds(-1, 6, -1, 6);

    let c1 = 3;
    let c2 = 2;

    document.getElementById('slider-c1').appendChild(createDKSlider({
      id: 's-c1', label: 'Coefficient c1 (for x)', min: 1, max: 10, step: 1, value: c1,
      onChange: (val) => { c1 = val; update(); }
    }));

    document.getElementById('slider-c2').appendChild(createDKSlider({
      id: 's-c2', label: 'Coefficient c2 (for y)', min: 1, max: 10, step: 1, value: c2,
      onChange: (val) => { c2 = val; update(); }
    }));

    function update() {
      viewport.clear();
      const res = MathEngine.solveLPP(c1, c2, []);

      viewport.addObject({ id: 'lppRegion', type: 'lpp', data: { corners: res.corners } });

      document.getElementById('val-maxz').textContent = res.maxVal.toFixed(2);
      document.getElementById('val-corner').textContent = `(${res.optimalCorner.x}, ${res.optimalCorner.y})`;
      document.getElementById('val-c1-text').textContent = String(c1);
      document.getElementById('val-c2-text').textContent = String(c2);

      const practiceBox = document.getElementById('practice-container');
      practiceBox.innerHTML = '';
      practiceBox.appendChild(createPracticePanel({
        chapter: 12,
        exercise: '12.1',
        questionNumber: 'Q1',
        importanceCategory: 'Core Concept',
        questionText: `Maximize Z = ${c1}x + ${c2}y subject to constraints x + y ≤ 4, x ≤ 3, x ≥ 0, y ≥ 0.`,
        whatThisTeaches: 'Finding the optimal maximum of a linear objective function using corner points of the bounded feasible region.',
        given: [`Z = ${c1}x + ${c2}y`, 'Constraints: x + y ≤ 4, x ≤ 3, x ≥ 0, y ≥ 0'],
        required: 'Maximum value of Z and corresponding point (x,y).',
        formulaLatex: `Z_{\\max} = \\max_{(x,y) \\in \\text{Corners}} (${c1}x + ${c2}y)`,
        steps: [
          'Graph boundary lines x + y = 4 and x = 3 along with coordinate axes x=0, y=0.',
          'Shade the bounded polygon feasible region.',
          'Identify corner vertices: (0,0), (3,0), (3,1), and (0,4).',
          `Evaluate Z at each corner: Z(0,0)=0, Z(3,0)=${3*c1}, Z(3,1)=${3*c1 + c2}, Z(0,4)=${4*c2}.`,
          `Identify maximum value Z = ${res.maxVal} at point (${res.optimalCorner.x}, ${res.optimalCorner.y}).`
        ],
        finalAnswerLatex: `Z_{\\max} = ${res.maxVal} \\quad \\text{at } (${res.optimalCorner.x}, ${res.optimalCorner.y})`,
        understandIt: 'The Fundamental Theorem of Linear Programming guarantees that optimal solutions occur at extreme corner points.'
      }));
    }

    update();
  </script>
</body>
</html>
