<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integrals Lab — DKGraphSuite</title>
  <link rel="stylesheet" href="./src/styles/tokens.css" />
</head>
<body class="bg-dk-bg text-dk-text min-h-screen flex flex-col">
  <div id="header-container"></div>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col gap-6">
    <div class="flex flex-wrap justify-between items-center gap-4">
      <div>
        <span class="text-xs font-bold uppercase tracking-wider text-dk-primary bg-dk-primary/10 px-2.5 py-1 rounded border border-dk-primary/20">Std 12 Priority · Chapter 7</span>
        <h1 class="text-2xl md:text-3xl font-extrabold text-dk-text mt-1">Integrals & Riemann Area Studio</h1>
      </div>
    </div>

    <!-- Main Workspace (2 Columns) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      <!-- Left: Graph Viewport + Controls (7 Cols) -->
      <div class="lg:col-span-7 flex flex-col gap-4">
        <div class="bg-dk-surface border border-dk-border rounded-dk-lg p-4 shadow-dk-sm flex flex-col gap-3">
          <div class="flex justify-between items-center text-xs font-semibold text-dk-muted">
            <span>Definite Integral Shaded Region (Blue Shaded: ∫_a^b f(x) dx)</span>
          </div>
          <div id="viewport-container" class="w-full h-[400px] relative"></div>

          <!-- Parameter Sliders -->
          <div id="slider-limit-a"></div>
          <div id="slider-limit-b"></div>
        </div>
      </div>

      <!-- Right: Computation & Textbook Practice (5 Cols) -->
      <div class="lg:col-span-5 flex flex-col gap-5">
        <!-- Exact vs Numeric Integral Result Card -->
        <div class="bg-dk-surface border border-dk-border rounded-dk-lg p-5 shadow-dk-sm flex flex-col gap-3">
          <h3 class="text-md font-bold text-dk-text border-b border-dk-border pb-2">Integral Calculation Summary</h3>
          <div class="grid grid-cols-2 gap-3 text-sm">
            <div class="bg-dk-bg p-3 rounded-dk border border-dk-border">
              <span class="text-xs text-dk-muted block">Exact Integral Value</span>
              <strong id="val-exact" class="text-lg text-dk-primary font-mono">21.0000</strong>
            </div>
            <div class="bg-dk-bg p-3 rounded-dk border border-dk-border">
              <span class="text-xs text-dk-muted block">Simpson Numeric</span>
              <strong id="val-numeric" class="text-lg text-dk-text font-mono">21.0000</strong>
            </div>
          </div>
          <div class="bg-dk-surface-hover p-3 rounded-dk border border-dk-border text-xs text-dk-muted">
            <strong>Antiderivative:</strong> F(x) = x³/3 <br />
            <strong>Fundamental Theorem:</strong> F(b) - F(a) = (<span id="val-fb">64/3</span>) - (<span id="val-fa">1/3</span>)
          </div>
        </div>

        <!-- 10-Section Practice Question View -->
        <div id="practice-container"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { createDKHeader } from './src/components/ui/DKHeader.ts';
    import { GraphViewport } from './src/components/math/GraphViewport.ts';
    import { createDKSlider } from './src/components/ui/DKSlider.ts';
    import { MathEngine } from './src/core/MathEngine.ts';
    import { createPracticePanel } from './src/components/math/PracticePanel.ts';

    document.getElementById('header-container').appendChild(createDKHeader());

    const viewportContainer = document.getElementById('viewport-container');
    const viewport = new GraphViewport(viewportContainer);
    viewport.setBounds(-1, 5, -2, 20);

    let limitA = 1;
    let limitB = 4;

    // Sliders
    document.getElementById('slider-limit-a').appendChild(createDKSlider({
      id: 's-a', label: 'Lower Limit (a)', min: 0, max: 3, step: 0.1, value: limitA,
      onChange: (val) => { limitA = val; update(); }
    }));

    document.getElementById('slider-limit-b').appendChild(createDKSlider({
      id: 's-b', label: 'Upper Limit (b)', min: 1, max: 5, step: 0.1, value: limitB,
      onChange: (val) => { limitB = val; update(); }
    }));

    function update() {
      viewport.clear();
      const fn = (x) => x * x;

      viewport.addObject({ id: 'integralRegion', type: 'integral', color: 'rgba(37, 99, 235, 0.25)', data: { fn, a: limitA, b: limitB } });

      const exact = (Math.pow(limitB, 3) - Math.pow(limitA, 3)) / 3;
      const num = MathEngine.definiteIntegral(fn, limitA, limitB);

      document.getElementById('val-exact').textContent = exact.toFixed(4);
      document.getElementById('val-numeric').textContent = num.toFixed(4);
      document.getElementById('val-fb').textContent = (Math.pow(limitB, 3) / 3).toFixed(2);
      document.getElementById('val-fa').textContent = (Math.pow(limitA, 3) / 3).toFixed(2);

      // Update Practice Question View
      const practiceBox = document.getElementById('practice-container');
      practiceBox.innerHTML = '';
      practiceBox.appendChild(createPracticePanel({
        chapter: 7,
        exercise: '7.9',
        questionNumber: 'Q1',
        importanceCategory: 'Core Concept',
        questionText: `Evaluate the definite integral ∫_{${limitA.toFixed(1)}}^{${limitB.toFixed(1)}} x^2 \\, dx.`,
        whatThisTeaches: 'Evaluating definite integrals using antiderivatives and the Fundamental Theorem of Calculus.',
        given: [`f(x) = x^2`, `a = ${limitA.toFixed(1)}`, `b = ${limitB.toFixed(1)}`],
        required: 'The exact area under the parabola y = x^2.',
        formulaLatex: `\\int_a^b x^2 \\, dx = \\left[ \\frac{x^3}{3} \\right]_a^b = \\frac{b^3 - a^3}{3}`,
        steps: [
          `Find the antiderivative F(x) = \\frac{x^3}{3}`,
          `Substitute upper limit b = ${limitB.toFixed(1)}: F(b) = ${(Math.pow(limitB, 3)/3).toFixed(4)}`,
          `Substitute lower limit a = ${limitA.toFixed(1)}: F(a) = ${(Math.pow(limitA, 3)/3).toFixed(4)}`,
          `Subtract F(b) - F(a) = ${exact.toFixed(4)}`
        ],
        finalAnswerLatex: `\\int_{${limitA.toFixed(1)}}^{${limitB.toFixed(1)}} x^2 \\, dx = ${exact.toFixed(4)}`,
        understandIt: 'Definite integrals compute net signed area bounded between the function and the x-axis.'
      }));
    }

    update();
  </script>
</body>
</html>
