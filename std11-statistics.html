<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Statistics Studio — DKGraphSuite</title>

<body class="bg-dk-bg text-dk-text min-h-screen flex flex-col">

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col gap-6">
    <div class="border-b border-dk-border pb-3">
      <span class="text-xs font-bold uppercase tracking-wider text-dk-primary bg-dk-primary/10 px-2.5 py-1 rounded border border-dk-primary/20">Std 11 · Chapter 14</span>

  <script type="module">

    document.getElementById('header-container').appendChild(createDKHeader());
